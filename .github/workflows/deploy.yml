name: Deploy to miriamngo.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-miriamngo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key" \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'public/uploads/' \
            --exclude 'memorial.db' \
            --exclude '.git/' \
            --exclude '.github/' \
            ./ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Install deps and restart on server
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && npm install --omit=dev --no-audit --no-fund && pm2 restart memorial-site --update-env 2>&1"

      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://miriamngo.com/ || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed after 5 attempts (last status: $STATUS)"
          # Dump recent PM2 logs for debugging
          ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "pm2 logs memorial-site --lines 15 --nostream 2>&1" || true
          exit 1
