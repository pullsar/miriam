name: Extract Catholic Igbo Missal evidence

on:
  workflow_dispatch:
  push:
    branches:
      - research/igbo-missal-extract
    paths:
      - ".github/workflows/extract-catholic-igbo.yml"
      - "scripts/extract-catholic-igbo-app.sh"
      - "scripts/analyze_igbo_payload.py"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [365, pworld]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analysis tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apktool apksigner sqlite3 ripgrep unzip zip file jq curl \
            python3 python3-pip openjdk-17-jre-headless
          JADX_URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' \
            | head -n1)"
          test -n "$JADX_URL"
          curl -fL --retry 3 "$JADX_URL" -o /tmp/jadx.zip
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"

      - name: Download, decompile and inspect
        id: extract_app
        continue-on-error: true
        shell: bash
        run: |
          set -x
          printf 'matrix.app=<%s>\n' "${{ matrix.app }}"
          bash scripts/extract-catholic-igbo-app.sh "${{ matrix.app }}" "research-out/${{ matrix.app }}"

      - name: Build compact evidence bundle
        if: steps.extract_app.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/analyze_igbo_payload.py \
            "research-out/${{ matrix.app }}" \
            "research-out/${{ matrix.app }}/evidence"

      - name: Upload evidence
        if: steps.extract_app.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: catholic-igbo-${{ matrix.app }}-evidence-${{ github.run_id }}
          path: research-out/${{ matrix.app }}/evidence/
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Upload extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catholic-igbo-${{ matrix.app }}-diagnostics-${{ github.run_id }}
          path: research-out/${{ matrix.app }}/reports/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Fail job if extraction failed
        if: steps.extract_app.outcome != 'success'
        shell: bash
        run: |
          echo "Extraction failed; diagnostic artifact has been preserved."
          exit 1
